<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Business Card API</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: #94a3b8;
      }

      nav {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      a {
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
      }

      a:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Business Card API</h1>
      <p>NestJS · Prisma · PostgreSQL · GraphQL</p>
      <nav>
        <a href="/graphql">Apollo Sandbox</a>
        <a href="/health">Health check</a>
      </nav>
    </main>
  </body>
</html>
